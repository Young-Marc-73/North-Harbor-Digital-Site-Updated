# Netlify configuration for North Harbor Digital

[build]
  publish = "."

# Long-cache static assets (images, fonts, CSS, JS)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security + best-practice headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Pretty URLs — let visitors hit /services instead of /services.html
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/hosting"
  to = "/hosting.html"
  status = 200

[[redirects]]
  from = "/social"
  to = "/social.html"
  status = 200

# Catch-all 404 — explicitly serve 404.html for any unmatched path
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
