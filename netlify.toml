# Netlify configuration for North Harbor Digital

[build]
  publish = "."

# Long-cache static assets (images, fonts, CSS, JS)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security + best-practice headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Canonical URLs — 301 the .html version to the clean path.
# force = true is required so the redirect wins over the existing static .html file.
[[redirects]]
  from = "/services.html"
  to = "/services"
  status = 301
  force = true

[[redirects]]
  from = "/hosting.html"
  to = "/hosting"
  status = 301
  force = true

[[redirects]]
  from = "/social.html"
  to = "/social"
  status = 301
  force = true

[[redirects]]
  from = "/checklist.html"
  to = "/checklist"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/terms.html"
  to = "/terms"
  status = 301
  force = true

[[redirects]]
  from = "/cookies.html"
  to = "/cookies"
  status = 301
  force = true

[[redirects]]
  from = "/thank-you.html"
  to = "/thank-you"
  status = 301
  force = true

# Pretty URLs — serve the .html file behind each clean path (internal 200, no redirect).
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/hosting"
  to = "/hosting.html"
  status = 200

[[redirects]]
  from = "/social"
  to = "/social.html"
  status = 200

[[redirects]]
  from = "/checklist"
  to = "/checklist.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/cookies"
  to = "/cookies.html"
  status = 200

[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

# Catch-all 404 — explicitly serve 404.html for any unmatched path
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
